<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración del Blog</title>
    <style>
        :root {
            --azul-gradiente: #0033FF;
            --texto-dinamico: #333;
            --bg-dinamico: #F2E6EE;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dinamico);
            color: var(--texto-dinamico);
            padding: 20px;
        }
        .btn-primario {
            background: var(--azul-gradiente);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-secundario {
            background: #ccc;
            color: #333;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .card-glass {
            background: rgba(255, 255, 255, 0.8);
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    
    <div class="blog-container" style="max-width: 900px; margin: 0 auto;">
        <h1 style="color: var(--azul-gradiente);">Panel de Administración del Blog</h1>
        
        <div style="margin-bottom: 20px;">
            <button class="btn-primario" onclick="abrirModalCrear()" style="padding: 10px 20px;">+ Nueva Publicación</button>
        </div>
    
        <div class="card-glass" style="padding: 20px; overflow-x: auto;">
            <table style="width: 100%; border-collapse: collapse; text-align: left;">
                <thead>
                    <tr style="border-bottom: 2px solid var(--azul-gradiente);">
                        <th style="padding: 12px;">Título</th>
                        <th style="padding: 12px;">Fecha</th>
                        <th style="padding: 12px; text-align: center;">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-posts">
                    </tbody>
            </table>
        </div>
    </div>

    <div id="modal-crud" style="display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); z-index: 2000; justify-content: center; align-items: center;">
        <div style="background: white; padding: 30px; border-radius: 15px; width: 90%; max-width: 600px; max-height: 90vh; overflow-y: auto;">
            <h2 id="modal-titulo" style="color: var(--azul-gradiente); margin-top: 0;">Nueva Publicación</h2>
            
            <form id="form-blog">
                <input type="hidden" id="post-id">
                
                <label style="display:block; margin-bottom: 5px; font-weight: bold;">Título</label>
                <input type="text" id="titulo" required style="width:95%; padding:10px; margin-bottom:15px; border-radius:8px; border:1px solid #ccc;">
        
                <label style="display:block; margin-bottom: 5px; font-weight: bold;">Extracto (Resumen corto)</label>
                <input type="text" id="extracto" required style="width:95%; padding:10px; margin-bottom:15px; border-radius:8px; border:1px solid #ccc;">
        
                <label style="display:block; margin-bottom: 5px; font-weight: bold;">Contenido de la noticia</label>
                <textarea id="contenido" rows="6" required style="width:95%; padding:10px; margin-bottom:15px; border-radius:8px; border:1px solid #ccc; font-family: inherit;"></textarea>
        
                <label style="display:block; margin-bottom: 5px; font-weight: bold;">Video (MP4 en carpeta /videos)</label>
                <input type="file" id="video_file" accept="video/mp4" style="width:100%; margin-bottom:20px;">
                
                <div style="display: flex; gap: 10px; justify-content: flex-end;">
                    <button type="button" onclick="cerrarModal()" class="btn-secundario" style="padding: 10px 20px;">Cancelar</button>
                    <button type="submit" class="btn-primario" style="padding: 10px 20px;">Guardar Publicación</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 1. Cargar las publicaciones nada más abrir la página
        document.addEventListener('DOMContentLoaded', cargarPostsCRUD);

        async function cargarPostsCRUD() {
            try {
                // Como crud.php está en la misma carpeta, la ruta es directa
                const res = await fetch('crud.php?accion=listar');
                const posts = await res.json();
                
                const tabla = document.getElementById('tabla-posts');
                tabla.innerHTML = posts.map(p => `
                    <tr style="border-bottom: 1px solid #eee;">
                        <td style="padding: 12px; font-weight: bold;">${p.titulo}</td>
                        <td style="padding: 12px;">${p.fecha}</td>
                        <td style="padding: 12px; text-align: center;">
                            <button onclick="editarPost(${p.id})" style="background:none; border:none; cursor:pointer; font-size:1.2rem;" title="Editar">📝</button>
                            <button onclick="borrarPost(${p.id})" style="background:none; border:none; cursor:pointer; font-size:1.2rem;" title="Borrar">🗑️</button>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                console.error("Error al cargar la tabla:", error);
            }
        }

        // 2. Funciones del Modal
        function abrirModalCrear() {
            document.getElementById('form-blog').reset();
            document.getElementById('post-id').value = '';
            document.getElementById('modal-titulo').innerText = 'Nueva Publicación';
            document.getElementById('modal-crud').style.display = 'flex';
        }

        function cerrarModal() {
            document.getElementById('modal-crud').style.display = 'none';
        }

        // 3. Editar Post
        async function editarPost(id) {
            try {
                const res = await fetch(`crud.php?accion=obtener&id=${id}`);
                const p = await res.json();
                
                document.getElementById('post-id').value = p.id;
                document.getElementById('titulo').value = p.titulo;
                document.getElementById('extracto').value = p.extracto;
                document.getElementById('contenido').value = p.contenido;
                // Nota: Los inputs de tipo "file" no se pueden rellenar por seguridad del navegador
                
                document.getElementById('modal-titulo').innerText = 'Editar Publicación';
                document.getElementById('modal-crud').style.display = 'flex';
            } catch (error) {
                console.error("Error al obtener datos:", error);
            }
        }

        // 4. Borrar Post
        async function borrarPost(id) {
            if(confirm('¿Deseas eliminar permanentemente esta publicación?')) {
                await fetch(`crud.php?accion=borrar&id=${id}`);
                cargarPostsCRUD(); // Recargar la tabla
            }
        }

        // 5. Enviar el Formulario (Crear / Actualizar)
        document.getElementById('form-blog').addEventListener('submit', async (e) => {
            e.preventDefault(); // Evita que la página se recargue
            
            const formData = new FormData();
            formData.append('id', document.getElementById('post-id').value);
            formData.append('titulo', document.getElementById('titulo').value);
            formData.append('extracto', document.getElementById('extracto').value);
            formData.append('contenido', document.getElementById('contenido').value);
            
            const videoFile = document.getElementById('video_file').files[0];
            if (videoFile) {
                formData.append('video_file', videoFile);
            }

            try {
                await fetch('crud.php?accion=guardar', {
                    method: 'POST',
                    body: formData
                });
                
                cerrarModal();
                cargarPostsCRUD(); // Recargar la tabla para ver los cambios
            } catch (error) {
                console.error("Error al guardar:", error);
                alert("Hubo un error al guardar la publicación.");
            }
        });
    </script>
</body>
</html>
